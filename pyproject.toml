[project]
name = "gdelt-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3", "duckdb", "pandas", "pyarrow", "python-dotenv", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdelt_pipeline"]